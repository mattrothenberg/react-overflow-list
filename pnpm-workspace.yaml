allowBuilds:
  esbuild: set this to true or false
# Refuse to resolve any dependency version published less than 3 days ago.
# Supply-chain worms (Shai-Hulud etc.) are usually detected and unpublished
# within hours, so this keeps freshly-poisoned releases out of the tree.
# Only affects resolution (updates / new installs), not frozen-lockfile installs.
minimumReleaseAge: 4320

# Dependencies whose install scripts we deliberately do not run.
ignoredBuiltDependencies:
  - core-js
  - core-js-pure
  - esbuild
  - highlight.js
